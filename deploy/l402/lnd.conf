# Minimal mainnet LND receiver for the L402 gateway.
# RPC and REST are reachable only through the private Docker network and
# loopback-only host bindings defined in docker-compose.yml.

alias=repo-opportunity-scan
color=#f7931a
debuglevel=info

listen=0.0.0.0:9735
externalip=145.79.2.245:9735
rpclisten=0.0.0.0:10009
restlisten=0.0.0.0:8080

tlsextraip=127.0.0.1
tlsextradomain=lnd
tlsextradomain=l402-lnd

wallet-unlock-password-file=/run/secrets/lnd_wallet_password
wallet-unlock-allow-create=true

bitcoin.active=true
bitcoin.mainnet=true
bitcoin.node=neutrino
bitcoin.defaultchanconfs=3

fee.url=https://nodes.lightning.computer/fees/v1/btc-fee-estimates.json
neutrino.addpeer=btcd0.lightning.computer
neutrino.addpeer=mainnet1-btcd.zaphq.io
neutrino.addpeer=mainnet2-btcd.zaphq.io
neutrino.maxpeers=8
neutrino.persistfilters=true

db.backend=sqlite
autopilot.active=false
nat=false
